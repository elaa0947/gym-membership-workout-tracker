<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Member Login | Corely Gym</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body class="auth-page">

    <header class="navbar">

        <a href="../index.html" class="brand">
            <span class="brand-mark">C</span>
            <span>Corely</span>
        </a>

        <a href="../index.html" class="back-link">
            ← Back to home
        </a>

    </header>


    <main class="auth-container">

        <section class="auth-intro">

            <span class="eyebrow">
                MEMBER LOGIN
            </span>

            <h1>
                Welcome<br>
                <span>back.</span>
            </h1>

            <p>
                Sign in to access your membership,
                workout plans and progress.
            </p>

            <div class="trust-row">

                <span class="trust-item">
                    <span class="status-dot"></span>
                    Secure login
                </span>

                <span class="trust-item">
                    ✓ Member access
                </span>

            </div>

        </section>


        <section class="form-card">

            <div class="form-header">

                <div>

                    <span class="eyebrow">
                        EXISTING MEMBER
                    </span>

                    <h2>Sign in</h2>

                    <p>
                        Enter your account details below.
                    </p>

                </div>

                <span class="step-indicator">
                    01 / 01
                </span>

            </div>


            <form id="loginForm" novalidate>

                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                    >

                    <small
                        class="field-error"
                        id="emailError"
                    ></small>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >

                    <small
                        class="field-error"
                        id="passwordError"
                    ></small>

                </div>


                <div
                    id="formMessage"
                    class="form-message"
                    role="alert"
                ></div>


                <button
                    type="submit"
                    class="primary-button submit-button"
                >
                    Sign in
                    <span>→</span>
                </button>


                <p class="form-footer">
                    Don't have an account?
                    <a href="register.html">
                        Create account
                    </a>
                </p>

            </form>

        </section>

    </main>


    <script
        type="module"
        src="../js/login.js"
    ></script>

</body>

</html>
