services:
  - type: web
    name: gym-tracker-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://snappy-onyx-i4afoam.tmp.now,http://localhost:5500"
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:h2:file:/app/data/gym_tracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"
      - key: SPRING_DATASOURCE_USERNAME
        value: "sa"
      - key: SPRING_DATASOURCE_PASSWORD
        value: ""
