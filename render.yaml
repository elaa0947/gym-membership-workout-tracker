services:
  - type: web
    name: gym-tracker-backend
    runtime: docker
    dockerfilePath: ./backend/gym-tracker-backend/Dockerfile
    dockerContext: ./backend/gym-tracker-backend
    plan: free
    region: oregon
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: gym-tracker-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: gym-tracker-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: gym-tracker-db
          property: password
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://snappy-onyx-i4afoam.tmp.now,http://localhost:5500"
      - key: PORT
        value: 8080

databases:
  - name: gym-tracker-db
    databaseName: gym_tracker
    user: gym_app
    plan: free
    region: oregon
